name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and unit test (Linux runner)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK and release bundle, run unit tests
        run: gradle assembleDebug bundleRelease testDebugUnitTest --stacktrace

      - name: Upload debug APK (installable)
        uses: actions/upload-artifact@v4
        with:
          name: android-foundation-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release bundle (unsigned until signing is configured)
        uses: actions/upload-artifact@v4
        with:
          name: android-foundation-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  emulator-test:
    name: Instrumented tests on Android emulator (API 36)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Enable KVM for the emulator
        run: |
          echo "KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\"" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          script: gradle connectedDebugAndroidTest --stacktrace
